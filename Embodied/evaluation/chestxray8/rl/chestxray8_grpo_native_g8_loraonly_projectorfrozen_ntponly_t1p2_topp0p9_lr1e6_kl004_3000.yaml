# Fresh 3000-step MedGround-KL experiment derived from the selected
# LR=1e-5, KL-off, pure-NTP production configuration.  The only scientific
# changes are LR=1e-6 and enabling the audited MedGround KL objective at
# beta=0.04.  Duration/checkpoint cadence are procedural changes.
base_config: chestxray8_grpo_hybrid_native.yaml

experiment_contract:
  status: prepared_for_manual_launch_only
  run_name: G8_MEDGROUND_KL004_LORAONLY_PROJECTORFROZEN_NTPONLY_T1P2_TOPP0P9_LR1E6_3000
  scientific_reference: G8_KL0_LORAONLY_PROJECTORFROZEN_NTPONLY_T1P2_TOPP0P9_LR1E5_500_CONTROLLED
  initialization: fresh_original_frozen_base
  optimizer_update_limit: 3000
  checkpoint_steps: [500, 1000, 1500, 2000, 2500, 3000]
  intermediate_validation: disabled
  heldout_test_role: forbidden_during_training_and_checkpoint_selection

overrides:
  experiment: G8_MEDGROUND_KL004_LORAONLY_PROJECTORFROZEN_NTPONLY_T1P2_TOPP0P9_LR1E6_3000
  hardware:
    required_gpu_name_substring: RTX 3090
    visible_gpu_count: 2
    decoder_layer_split: [18, 18]
  medground_source_audit:
    repository_commit: 37b210dd7d6ee71179b3013d7f8042af1de0d5d3
    trainer_upstream_era_commit: ebc741f160b9d0c2312cd627516bf6c0ecd73343
    launch_explicit_beta: null
    dependency_specification: "trl @ git+https://github.com/huggingface/trl.git@main"
    upstream_era_trl_beta_default: 0.04
    selected_explicit_beta: 0.04
  model:
    projector_trainable: false
  objective:
    loss_total: L_GRPO_PLUS_MEDGROUND_KL
    group_size: 8
    reference_kl:
      enabled: true
      beta: 0.04
      estimator: exp_ref_minus_policy_minus_ref_minus_policy_minus_one
      direction: policy_to_reference
      granularity: sampled_trajectory_token
      normalization: mean_tokens_per_trajectory_then_mean_group
      mask: full_hybrid_sampled_trajectory
      include_rejected_pbd_proposals: true
      exclude_prompt_tokens: true
      exclude_image_tokens: true
      reference_policy: initial_fresh_start_policy
      reference_storage: shared_frozen_base_with_cpu_snapshot_swap
      reference_lora: initial_zero_effect_adapter_state
      reference_projector: original_pretrained_state
      reference_mode: eval
      reference_autograd: disabled
  policy_state:
    synchronized_parameters: [lora]
    reference_projector: frozen_pretrained_state
  rollout:
    path: stochastic_native_ntp_rl
    temperature: 1.2
    top_p: 0.9
    top_k: 0
    repetition_penalty: 1.0
    max_new_tokens: 512
    reconstruct_actions_from_text: false
    hybrid:
      enabled: false
      logprob_objective: full_trajectory
      score_rejected_pbd_proposals: false
      prefer_committed_action_logprobs: true
      fallback_enabled: false
    ntp_only:
      enabled: true
      generation_mode: slow
      pbd_enabled: false
      mtp_enabled: false
      hybrid_fallback_enabled: false
      rejected_proposal_trajectory_enabled: false
  data:
    train_split: splits/production_train90_validation10_seed42/optimization90_of_train80_seed42.jsonl
    train_sha256: 4edbed2071e4010c83c45ce8d33d341e0813fba2276150c82c990f1c7e9822f6
    internal_validation_split: splits/production_train90_validation10_seed42/validation10_of_train80_seed42.jsonl
    internal_validation_sha256: f22343be5c53aa61ef31dbd018070148f7c2d53580af0d176025f57a4d407838
  training:
    seed: 42
    max_optimizer_steps: 3000
    learning_rate: 1.0e-6
    projector_learning_rate: 1.0e-5
    max_grad_norm: 1.0
    checkpoint_interval: 500
    resume_from_checkpoint: null
  diagnostics:
    spatial_density:
      enabled: true
      aggregate_every_optimizer_updates: 25
      log_every_attempted_group: true
      expected_group_size: 8

locked_contract:
  scientific_changes_from_selected_lr1e5_kl0:
    training.learning_rate: {from: 1.0e-5, to: 1.0e-6}
    objective.loss_total: {from: L_GRPO, to: L_GRPO_PLUS_MEDGROUND_KL}
    objective.reference_kl: {from: {enabled: false}, to: {enabled: true, beta: 0.04}}
  procedural_changes:
    training.max_optimizer_steps: {from: 500, to: 3000}
    training.checkpoint_interval: {from: 100, to: 500}
    intermediate_validation: {from: gated_every_100_steps, to: disabled}
  unchanged_sampling: {temperature: 1.2, top_p: 0.9, top_k: 0, repetition_penalty: 1.0, max_new_tokens: 512}
  model_revision: c32291ca5e996f5a7a485845b4f57a233936bba0
  parser: native_locateanything
  native_output: "<ref>...</ref><box>...</box>"
  reward_weights: {format: 1.0, spatial: 1.0, semantic: 1.0}
  spatial: {type: binary_iou, comparison: greater_than, iou_threshold: 0.5}
  semantic: {type: medclip_roi_text_cosine, frozen: true, image_input: native_predicted_roi, text_input: original_query}
  trainable_tensor_contract: {lora: 504, mlp1_projector: 0, total: 504}
  runtime: {detach_kv: false, functional_kv_checkpoint_backend: true}
  initialization: {fresh_start_required: true, resume_forbidden: true, initial_optimizer_step: 0, seed: 42}
  split: {optimization_examples: 710, internal_validation_examples: 80, heldout_test_used: false}
  checkpoint_steps: [500, 1000, 1500, 2000, 2500, 3000]

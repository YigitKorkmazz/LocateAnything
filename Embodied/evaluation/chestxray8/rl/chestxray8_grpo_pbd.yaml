experiment: chestxray8_reward_only_grpo_native_pbd
prompt:
  name: fixed_chain_of_box_v1
  template: |-
    You are given a chest X-ray image and a medical finding.

    Locate the image region corresponding to the following finding:
    "{query}"

    First output a step-by-step reasoning process inside <think> and </think>
    tags.

    Whenever you identify or discuss a specific region of interest during
    reasoning, append its bounding box using the native LocateAnything format:

    <box><x1><y1><x2><y2></box>

    Then output exactly one final bounding box inside <answer> and </answer>
    tags.

    The output must follow exactly this structure:

    <think>
    Textual reasoning containing zero or more intermediate
    <box><x1><y1><x2><y2></box> blocks.
    </think>
    <answer>
    Exactly one final <box><x1><y1><x2><y2></box> block.
    </answer>

    Rules:
    - Intermediate boxes are allowed only inside <think>.
    - The final prediction is only the box inside <answer>.
    - Use native single coordinate tokens <0> through <1000>.
    - Coordinate order is x1, y1, x2, y2.
    - Do not output more than one box inside <answer>.
    - Do not output any text after </answer>.

model:
  name_or_path: nvidia/LocateAnything-3B
  revision: c32291ca5e996f5a7a485845b4f57a233936bba0
  dtype: bfloat16
  base_llm_frozen: true
  vision_encoder_frozen: true
  projector_trainable: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    bias: none

objective:
  loss_total: L_GRPO
  supervised_losses: []
  ppo_clip_epsilon: 0.2
  old_policy_sync_interval_optimizer_steps: 1
  group_size: 4

rollout:
  path: stochastic_native_pbd_rl
  chain_of_box: true
  block_size: 6
  bbox_format: "<box><x1><y1><x2><y2></box>"
  coordinate_token_id_range: [151677, 152677]
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.0
  dynamic_filtering_enabled: false
  reconstruct_actions_from_text: false
  geometry_repair: false
  force_first_box_block: false
  max_sequence_length: 4096
  max_new_tokens: 512

rewards:
  use_final_answer_box_only: true
  intermediate_box_reward: false
  format:
    type: binary
    weight: 1.0
    require_exact_outer_structure: true
    require_exactly_one_final_native_box: true
  spatial:
    type: binary_iou
    weight: 1.0
    iou_threshold: 0.5
    comparison: greater_than
  semantic:
    type: medclip_roi_text_cosine
    weight: 1.0
    frozen: true
    image_input: final_answer_roi
    text_input: original_query

policy_state:
  old_policy_frozen_during_rollout_accumulation_and_ppo: true
  synchronize_after_optimizer_step_only: true
  synchronized_parameters: [lora, mlp1_projector]
  shared_frozen_base_serialized_snapshot_swap: true
  reference_projector: original_pretrained_state

data:
  train_split: splits/train80_pairs_seed42.jsonl
  train_sha256: a2b1c25f652f90e8d93e58b33ee74aa5eb09db4df7c6b37e760f5e5238c2e3b0
  test_split: splits/test_pairs_seed42.jsonl
  test_sha256: 783965de02032ad44cc387afa22cd2382649330a0f5f39e0caf5a62d3385a2ed

viability:
  sample_count: 100
  selection_seed: 42
  optimizer_updates: 0
  save_checkpoints: false
  save_rollout_traces: true
  save_machine_readable_metrics: true
  representative_examples: 20

training:
  seed: 42
  num_epochs: 3
  max_optimizer_steps: 2370
  learning_rate: 2.0e-5
  projector_learning_rate: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  use_8bit_adam: false
  checkpoint_interval: 100
  resume_from_checkpoint: null
  gradient_accumulation_samples: 1
  ppo_epochs: 1

evaluation:
  seed: 42
  max_new_tokens: 512
  ordinary_temperature: 0.0
  modes:
    - rl_native_stochastic_pbd
    - fast_mtp
    - slow_ntp
    - hybrid
  metrics:
    - mean_iou
    - median_iou
    - recall_at_0_5
    - valid_output_rate

outputs:
  viability_root: results/chestxray8_pbd_grpo/viability
  training_root: results/chestxray8_pbd_grpo/training
  evaluation_root: results/chestxray8_pbd_grpo/evaluation
  refuse_nonempty_output_dir: true

